# docker compose up -d   ->   mira el código de instalación con: docker compose logs portero
# y abre http://IP-DEL-SERVIDOR:8404/ para el asistente.
services:
  portero:
    image: ghcr.io/mubeira0/portero-proxy:latest
    # build: .              # descomenta para compilar desde el código fuente
    container_name: portero
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
      - "8404:8404"
    volumes:
      - portero-data:/data   # configuración, clave de cifrado, certificados y copias: haz copia de este volumen
    cap_drop: [ALL]
    cap_add: [NET_BIND_SERVICE]
    security_opt: ["no-new-privileges:true"]
    read_only: true
    tmpfs: ["/tmp"]
    # Para que Portero vea las IP reales de los visitantes (límites, bloqueos, registro) usa red host:
    # network_mode: host   (y quita "ports")
volumes:
  portero-data:
